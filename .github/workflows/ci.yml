name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        env:
          DATABASE_URL: ''
          STRIPE_SECRET_KEY: ''
          STRIPE_WEBHOOK_SECRET: ''
          RATE_LIMIT_REDIS_REST_URL: ''
          RATE_LIMIT_REDIS_REST_TOKEN: ''
          UPSTASH_REDIS_REST_URL: ''
          UPSTASH_REDIS_REST_TOKEN: ''
        run: npm test

      - name: Build
        run: npm run build
